        window.addEventListener("DOMContentLoaded", setupEvents);
    </script>
</head>
<body>

    <!--,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,-->
    
    <header>
        <h1>Donny's Calculator</h1>
    </header>
    <main>
        <div class="calculator">
            <div data-id="output" id="display" class="display">0</div>
            <div class="buttons">
                <!-- Buttons for numbers and operations -->
                <button data-id="operand" data-value="7">7</button>
                <button data-id="operand" data-value="8">8</button>
                <button data-id="operand" data-value="9">9</button>
                <button data-id="clear">A/C</button>
                <button data-id="delete" class="del">DEL</button>
                <button data-id="operand" data-value="4">4</button>
                <button data-id="operand" data-value="5">5</button>
                <button data-id="operand" data-value="6">6</button>
                <button data-id="operator" data-value="MULTIPLICATION">*</button>
                <button data-id="operator" data-value="DIVISION">/</button>
                <button data-id="operand" data-value="1">1</button>
                <button data-id="operand" data-value="2">2</button>
                <button data-id="operand" data-value="3">3</button>
                <button data-id="operator" data-value="ADDITION">+</button>
                <button data-id="operator" data-value="SUBTRACTION">-</button>
                <button data-id="operand" data-value="0">0</button>
                <button data-id="operand" data-value=".">.</button>
                <button data-id="square_root">√</button>
                <button data-id="answer">ANS</button>
                <button data-id="equals" class="calc">=</button>
            </div>
        </div>
    </main>
</body>
</html>
